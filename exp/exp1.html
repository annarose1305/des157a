<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 1</title>
</head>
<body>
    <h1>Experiment 1</h1>
    <h2>To view the code functionality, inspect the page by right clicking. Then, open the console tab to see the code in action.</h2>

    <script>
        /* This program is from one of the ideas on Canvas.
        This program will print the numbers from 1-100.
        For numbers divisible by 3, it will print "Fizz". For numbers
        divisible by 5, it will print "Buzz". All other numbers print normally. */

        // For Loop
        for(var i=1; i<=100; i++){
            // Sequence (checks for 3, then 5, then if no condition is met)
            if(i % 3 ==0){ // selection 1
                console.log("Fizz")
            } else if(i % 5 == 0){ // selection 2
                console.log("Buzz")
            } else{ // selection 3
                console.log(i)
            }
        }
    </script>
    
</body>
</html>
