<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Every Picture</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <link href="styles.css" rel="stylesheet">

</head>
<body>
    <h1>Every Picture</h1>

    <div class="caro_contain">

    </div>

    <section id="carousel">
        <div class="slider">
            <div class="my_pics">
                <img src="images/image1.jpg" alt="neon sign saying 'This present moment used to be the unimaginable future'" class="photo">
                <img src="images/image2.jpg" alt="early sunrise" class="photo">
                <img src="images/image3.jpg" alt="deconstruct, construct" class="photo">
                <img src="images/image4.jpg" alt="arboretum" class="photo">
                <img src="images/image5.jpg" alt="dream big with cat sleeping" class="photo">
                <img src="images/image6.jpg" alt="unitrans bus passing" class="photo">
            </div>
        </div>
    </section>

</body>
</html>
